<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSAP Loading Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(135deg, #f5f9fd 0%, #eaf1fa 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .bg-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  .bg-icon {
    position: absolute;
    color: #1257A2;
    pointer-events: none;
    transform-origin: center center;
  }
  .loader-stage {
    position: relative;
    width: 390px;
    height: 145px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .loader-stage svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  #logo0 {
    width: 210px;
    height: auto;
    opacity: 0;
  }
  #logo0-path1 {
    fill: none;
    stroke: #1257A2;
    stroke-width: 2.5;
  }
  #logo0-path2 {
    fill: none;
    stroke: #0F1017;
    stroke-width: 2.5;
  }
  #logo1 {
    width: 185px;
    height: auto;
    opacity: 0;
  }
  #logo1 path {
    fill: url(#logo-grad);
  }
  #logo2 {
    opacity: 0;
  }
  #part-one {
    stroke: #FDE300;
    stroke-width: 1.5;
  }
  #part-two {
    stroke: #221E1F;
    stroke-width: 1.5;
  }
  #ending-stage {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }
  #logo-ending {
    width: 140px;
    height: auto;
    margin-bottom: -15px;
    opacity: 0;
  }
  #text-adoteam {
    position: relative;
    display: flex;
    font-family: 'Poppins', sans-serif;
    font-size: 54px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #000000;
    text-transform: lowercase;
    perspective: 500px;
  }
  #text-adoteam span {
    display: inline-block;
    transform-origin: bottom center;
  }
</style>
</head>
<body>

<div class="bg-container"></div>

<div class="loader-stage">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const logo0Path1 = document.getElementById('logo0-path1');
  const logo0Path2 = document.getElementById('logo0-path2');
  const len0_1 = logo0Path1.getTotalLength();
  const len0_2 = logo0Path2.getTotalLength();

  logo0Path1.style.strokeDasharray = len0_1;
  logo0Path1.style.strokeDashoffset = len0_1;
  logo0Path2.style.strokeDasharray = len0_2;
  logo0Path2.style.strokeDashoffset = len0_2;

  logo0Path1.style.fillOpacity = 0;
  logo0Path2.style.fillOpacity = 0;

  const partOne = document.getElementById('part-one');
  const partTwo = document.getElementById('part-two');
  const partThree = document.getElementById('part-three');

  [partOne, partTwo].forEach(p => {
    const l = p.getTotalLength();
    p.style.strokeDasharray = l;
    p.style.strokeDashoffset = l;
  });

  [partOne, partTwo, partThree].forEach(p => {
    p.style.fillOpacity = 0;
  });

  const tl = gsap.timeline({ repeat: -1 });

  // Stage 0: draw logo0 outline
  tl.set('#logo0', { opacity: 1, scale: 0.95 })
  .to([logo0Path1, logo0Path2], {
    strokeDashoffset: 0,
    duration: 1.5,
    stagger: 0.15,
    ease: 'power2.inOut'
  })
  .to([logo0Path1, logo0Path2], {
    fillOpacity: 1,
    duration: 0.5,
    ease: 'power1.out'
  }, '-=0.2')
  .to('#logo0', {
    scale: 1.05,
    duration: 0.4,
    ease: 'power1.out'
  })
  // Morph transition to logo1
  .to('#logo0', {
    opacity: 0,
    scale: 0.8,
    rotate: -15,
    duration: 0.6,
    ease: 'power2.inOut'
  })

  // Stage 1: transition to second logo (logo1) with NO dasharray
  .set('#logo1', { opacity: 0, scale: 0.85 }, '-=0.3')
  .to('#logo1', {
    opacity: 1,
    scale: 1.05,
    duration: 0.8,
    ease: 'power2.out'
  }, '-=0.3')
  .to('#logo1', {
    opacity: 0,
    scale: 0.85,
    duration: 0.6,
    ease: 'power2.in'
  }, '+=0.8')

  // Stage 2: switch to second logo (id one = part-one/yellow bell, id two = part-two/dark outline)
  .set('#logo2', { opacity: 1 })
  .to(partOne, {
    strokeDashoffset: 0,
    duration: 0.8,
    ease: 'power2.out'
  }, '-=0.1')
  .to(partTwo, {
    strokeDashoffset: 0,
    duration: 0.8,
    ease: 'power2.out'
  }, '-=0.4')
  .to([partOne, partTwo, partThree], {
    fillOpacity: 1,
    duration: 0.5,
    ease: 'power1.out'
  })
  .to('#logo2', {
    scale: 1.1,
    duration: 0.4,
    ease: 'power1.inOut',
    yoyo: true,
    repeat: 1
  })
  .to('#logo2', {
    opacity: 0,
    duration: 0.5,
    ease: 'power2.in'
  }, '+=0.3')

  // Stage 3: show ending stage (logo + text)
  .set('#ending-stage', { opacity: 1, scale: 1 })
  .fromTo('#logo-ending', {
    opacity: 0,
    scale: 0.6,
    rotate: -10,
    y: 20
  }, {
    opacity: 1,
    scale: 1,
    rotate: 0,
    y: 0,
    duration: 0.8,
    ease: 'back.out(1.5)'
  })
  .fromTo('#text-adoteam span', {
    opacity: 0,
    y: 30,
    rotateX: -70,
    filter: 'blur(8px)'
  }, {
    opacity: 1,
    y: 0,
    rotateX: 0,
    filter: 'blur(0px)',
    duration: 0.8,
    stagger: 0.06,
    ease: 'back.out(1.5)'
  }, '-=0.6')
  .to('#ending-stage', {
    opacity: 0,
    scale: 0.95,
    duration: 0.6,
    ease: 'power2.in'
  }, '+=1.5')

  // Reset for loop
  .set('#logo0', { opacity: 0, scale: 0.95, rotate: 0 })
  .set([logo0Path1, logo0Path2], {
    strokeDashoffset: (i, target) => target.getTotalLength(),
    fillOpacity: 0
  })
  .set('#logo1', { opacity: 0, scale: 1 })
  .set([partOne, partTwo], {
    strokeDashoffset: (i, target) => target.getTotalLength()
  })
  .set([partOne, partTwo, partThree], {
    fillOpacity: 0
  })
  .set('#logo2', { scale: 1, opacity: 0 })
  .set('#ending-stage', { opacity: 0, scale: 1 })
  .set('#logo-ending', { opacity: 0, scale: 0.6, y: 0, rotate: 0 })
  .set('#text-adoteam span', { opacity: 0, y: 0, rotateX: 0, filter: 'blur(0px)' });

  // Generate and animate background icons
  const bgContainer = document.querySelector('.bg-container');
  const bgIcons = [
    'fa-code', 'fa-bell', 'fa-lightbulb', 'fa-rocket', 'fa-star', 
    'fa-bolt', 'fa-terminal', 'fa-compass', 'fa-atom', 'fa-laptop-code',
    'fa-cube', 'fa-layer-group', 'fa-icons', 'fa-network-wired'
  ];

  for (let i = 0; i < 20; i++) {
    const iconEl = document.createElement('i');
    const randomIcon = bgIcons[Math.floor(Math.random() * bgIcons.length)];
    iconEl.className = `fa-solid ${randomIcon} bg-icon`;
    
    const left = Math.random() * 100;
    const top = Math.random() * 100;
    const size = 18 + Math.random() * 24; 
    const opacity = 0.02 + Math.random() * 0.05; 
    const blur = 0.5 + Math.random() * 1.5; 

    iconEl.style.left = `${left}%`;
    iconEl.style.top = `${top}%`;
    iconEl.style.fontSize = `${size}px`;
    iconEl.style.opacity = opacity;
    iconEl.style.filter = `blur(${blur}px)`;
    
    bgContainer.appendChild(iconEl);

    gsap.to(iconEl, {
      x: 'random(-60, 60)',
      y: 'random(-60, 60)',
      rotation: 'random(-120, 120)',
      duration: 'random(12, 24)',
      repeat: -1,
      yoyo: true,
      ease: 'sine.inOut'
    });
  }
</script>

</body>
</html>
